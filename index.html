<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lettermint: free initials logo maker and brand kit</title>
    <meta
      name="description"
      content="Type your initials and get a logo, variations and a ready-to-use brand kit: favicons, app icons, OG image and colour palette. Free, no signup, runs in your browser."
    />

    <!-- TODO(launch): replace https://lettermint.example.com with the production domain
         (canonical, og:url and both image URLs; also public/robots.txt and public/sitemap.xml). -->
    <link rel="canonical" href="https://lettermint.example.com/" />

    <!-- Icons generated by Lettermint's own brand-kit export. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lettermint" />
    <meta property="og:title" content="Lettermint: free initials logo maker and brand kit" />
    <meta
      property="og:description"
      content="Initials in, brand kit out: logo, variations, favicons, OG image and palette. Free, private, works offline."
    />
    <meta property="og:url" content="https://lettermint.example.com/" />
    <meta property="og:image" content="https://lettermint.example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Lettermint LM mark next to the word Lettermint" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lettermint: free initials logo maker and brand kit" />
    <meta
      name="twitter:description"
      content="Initials in, brand kit out: logo, variations, favicons, OG image and palette. Free, private, works offline."
    />
    <meta name="twitter:image" content="https://lettermint.example.com/og-image.png" />
    <meta name="twitter:image:alt" content="The Lettermint LM mark next to the word Lettermint" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Lettermint needs JavaScript to draw your logo.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
