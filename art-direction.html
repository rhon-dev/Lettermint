<!doctype html>
<html>
  <body style="margin:0;background:#fff;font:12px system-ui">
    <div id="out" style="display:grid;grid-template-columns:repeat(6,max-content);gap:12px;padding:12px"></div>
    <script type="module">
      import { loadFont } from '/src/lib/glyphs.ts';
      import { buildLogo } from '/src/lib/buildLogo.ts';
      import { composeStarter } from '/src/lib/compose.ts';
      import { logoSvgString } from '/src/lib/svg.ts';
      import { svgToPng } from '/src/lib/exporter.ts';
      import { DEFAULTS } from '/src/store/logo.ts';
      const fonts = [['unbounded', 800], ['outfit', 800], ['syne', 800], ['space-grotesk', 700], ['fraunces', 600], ['fraunces', 800]];
      const text = new URLSearchParams(location.search).get('t') || 'LM';
      const shapes = (new URLSearchParams(location.search).get('sh') || 'none').split(',');
      const out = document.getElementById('out');
      for (const [id, w] of fonts) {
        const font = await loadFont(id, w);
        for (const shape of shapes) for (const kind of ['side', 'overlap', 'stack']) {
          const s = { ...DEFAULTS, text, fontId: id, weight: w, shape, bgColor: '#111111', fgColor: shape === 'none' ? '#111111' : '#ffffff', scale: 62, ...composeStarter(kind, font, text) };
          const svg = logoSvgString(s, buildLogo(s, font), 'x');
          const png = URL.createObjectURL(await svgToPng(svg, 16));
          const cell = document.createElement('figure');
          cell.style.margin = '0';
          cell.innerHTML = `<div style="width:160px;height:160px;outline:1px solid #eee">${svg.replace('<svg', '<svg width="160" height="160"')}</div><div style="display:flex;gap:6px;align-items:center"><img src="${png}" width="16" height="16"><img src="${png}" width="48" height="48" style="image-rendering:pixelated"> ${id} ${w} ${kind}</div>`;
          out.append(cell);
        }
      }
      document.title = 'done';
    </script>
  </body>
</html>
